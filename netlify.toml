[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--include=dev"

# SPA Fallback: All routes redirect to index.html with 200 status
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache control for PWA assets
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"
